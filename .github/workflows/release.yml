name: Release

# Tag `vX.Y.Z` (must equal version.txt) -> signed per-ABI release APKs + SHA-256 sums on a DRAFT GitHub Release.
# Review the draft and click "Publish release"; then run the "F-Droid repository" workflow (it skips drafts).
# Required secrets (see docs/RELEASING.md): ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD,
# ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD.

on:
  push:
    tags: ['v*']

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  native:
    uses: ./.github/workflows/build-native.yml

  release:
    needs: native
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write # create the GitHub Release and upload assets
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # versionCode is the commit count

      - name: Check tag matches version.txt
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="$(tr -d '[:space:]' < version.txt)"
          if [ "$TAG" != "v$version" ]; then
            echo "::error::Tag $TAG does not match version.txt (v$version)"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 21
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@7296c772c13d12d9871528814b51fb2143c138ef # v6.4.1
        with:
          cache-read-only: true

      - name: Install Android NDK, CMake and platform
        run: |
          ndk="$(sed -n 's/^ *ndkVersion *= *"\(.*\)"/\1/p' app/build.gradle.kts | tr -d '\r')"
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | sudo "$sdkmanager" --licenses > /dev/null || true
          sudo "$sdkmanager" "ndk;$ndk" "cmake;4.1.2" "build-tools;37.0.0" "platforms;android-37.0" > /dev/null
          # sudo can leave root-owned ~/.android or ~/.config/.android behind; AGP must be able to write
          # its debug keystore there. Use a user-owned location and repair anything already created.
          mkdir -p "$RUNNER_TEMP/android-user-home"
          echo "ANDROID_USER_HOME=$RUNNER_TEMP/android-user-home" >> "$GITHUB_ENV"
          sudo chown -R "$(id -u):$(id -g)" "$HOME/.android" "$HOME/.config" 2> /dev/null || true

      - name: Download native libraries
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.native.outputs.artifact-name }}
          path: native

      - name: Decode signing keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::Secret ANDROID_KEYSTORE_BASE64 is not set (see docs/RELEASING.md)"
            exit 1
          fi
          umask 077
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build signed release APKs
        env:
          # Read by app/build.gradle.kts. Passwords are masked by GitHub and never echoed.
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: >
          ./gradlew --console=plain
          -PskipRustBuild "-PrustJniLibsDir=$GITHUB_WORKSPACE/native/jniLibs"
          :app:assembleRelease

      - name: Collect APKs and checksums
        id: collect
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p dist
          shopt -s nullglob
          for apk in app/build/outputs/apk/release/app-*-release.apk; do
            abi="${apk##*/app-}"; abi="${abi%-release.apk}"
            cp "$apk" "dist/EasyTier-${VERSION}-${abi}.apk"
          done
          count="$(find dist -name '*.apk' | wc -l)"
          [ "$count" -eq 3 ] || { echo "::error::Expected 3 APKs (one per ABI), found $count"; ls -l app/build/outputs/apk/release; exit 1; }
          ( cd dist && sha256sum -- *.apk > SHA256SUMS.txt && cat SHA256SUMS.txt )

      - name: Verify APK signatures
        run: |
          apksigner="$(ls -d "$ANDROID_HOME"/build-tools/37.0.0/apksigner)"
          for apk in dist/*.apk; do
            "$apksigner" verify --print-certs "$apk" | grep -E 'certificate SHA-256|Verifies' | sed "s|^|$(basename "$apk"): |"
            # A release must not be signed with the Android debug key.
            if "$apksigner" verify --print-certs "$apk" | grep -qi 'CN=Android Debug'; then
              echo "::error::$apk is signed with the debug key"; exit 1
            fi
          done

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* --draft --title "EasyTier Compose $VERSION" --generate-notes --verify-tag
          fi
          {
            echo "### Release $TAG"
            echo '```'
            cat dist/SHA256SUMS.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
